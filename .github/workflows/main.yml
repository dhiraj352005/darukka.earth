name: Darukaa.Earth CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Frontend linting and build
  frontend-checks:
    name: Frontend Linting & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: false
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # Backend testing
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run import tests
        working-directory: ./backend
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from models import User, Project, Site
              from schemas import UserCreate, ProjectCreate, SiteCreate
              from auth import get_password_hash, verify_password
              print('✓ All imports successful')
          except Exception as e:
              print(f'✗ Import failed: {e}')
              sys.exit(1)
          "
      
      - name: Run syntax checks
        working-directory: ./backend
        run: |
          python -m py_compile main.py
          python -m py_compile database.py
          python -m py_compile models.py
          python -m py_compile schemas.py
          python -m py_compile auth.py
          python -m py_compile routes_auth.py
          python -m py_compile routes_projects.py
          python -m py_compile routes_sites.py
          echo "✓ All Python files compiled successfully"

  # Combined status check
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [frontend-checks, backend-tests]
    
    steps:
      - name: All checks completed
        run: |
          echo "✅ All CI checks passed successfully!"
          echo "Frontend linting: ✓"
          echo "Frontend build: ✓"
          echo "Backend tests: ✓"
